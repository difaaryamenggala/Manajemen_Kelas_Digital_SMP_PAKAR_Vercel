<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SMP PAKAR KAB. BOGOR - Manajemen Kelas Digital</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; background-color: #f0fdf4; }
    .bg-pakar-header { background: linear-gradient(135deg, #047857 0%, #065f46 50%, #064e3b 100%); }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #10b981; border-radius: 10px; }
  </style>
</head>
<body class="text-gray-800 pb-24 md:pb-8">

  <div id="app" class="max-w-md mx-auto md:max-w-4xl min-h-screen flex flex-col justify-between">
    
    <!-- HEADER -->
    <header id="main-header" class="p-5 rounded-b-3xl shadow-xl relative hidden text-white bg-pakar-header border-b-4 border-emerald-400">
      <div class="flex justify-between items-center">
        <div class="flex items-center space-x-3">
          <div class="w-12 h-12 bg-white/10 backdrop-blur-md rounded-2xl p-1 flex items-center justify-center border border-emerald-300/40 shadow-inner">
            <i class="fa-solid fa-school text-emerald-400 text-xl"></i>
          </div>
          <div>
            <p class="text-[10px] tracking-widest font-extrabold text-emerald-300 uppercase">SMP PAKAR KAB. BOGOR</p>
            <h1 id="user-display-name" class="text-lg font-bold leading-tight">Selamat Datang</h1>
            <span id="user-display-role" class="inline-block bg-emerald-950/60 text-emerald-200 border border-emerald-500/30 text-[11px] px-2.5 py-0.5 rounded-full font-semibold mt-0.5">Role</span>
          </div>
        </div>
        <button onclick="handleLogout()" title="Keluar" class="bg-white/10 hover:bg-rose-600/80 p-2.5 rounded-2xl transition border border-white/20 text-white flex items-center justify-center">
          <i class="fa-solid fa-right-from-bracket text-base"></i>
        </button>
      </div>
    </header>

    <main class="p-4 flex-1">

      <!-- LOGIN -->
      <section id="view-login" class="flex flex-col justify-center min-h-[85vh]">
        <div class="text-center mb-6">
          <div class="w-24 h-24 bg-white rounded-3xl mx-auto flex items-center justify-center shadow-2xl mb-4 border-4 border-emerald-500 p-2">
            <i class="fa-solid fa-graduation-cap text-emerald-600 text-5xl"></i>
          </div>
          <h2 class="text-2xl font-black text-gray-900 tracking-tight">SMP PAKAR</h2>
          <p class="text-xs font-bold text-emerald-700 tracking-widest uppercase mt-0.5">KABUPATEN BOGOR</p>
          <p class="text-xs text-gray-500 mt-2 font-medium">Sistem Informasi & Manajemen Kelas Digital</p>
        </div>

        <div class="bg-white p-6 rounded-3xl shadow-xl border border-emerald-100/80 relative overflow-hidden">
          <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-emerald-500 via-teal-500 to-sky-500"></div>
          <form onsubmit="handleLogin(event)" class="space-y-4">
            <div>
              <label class="block text-xs font-bold text-gray-700 mb-1.5 uppercase tracking-wider">User ID (NIS / NIP)</label>
              <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-gray-400"><i class="fa-solid fa-id-card"></i></span>
                <input type="text" id="login-userid" required placeholder="Masukkan UserID" class="w-full pl-10 pr-3 py-3 border border-gray-200 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-gray-50/50">
              </div>
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-700 mb-1.5 uppercase tracking-wider">Password</label>
              <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-gray-400"><i class="fa-solid fa-lock"></i></span>
                <input type="password" id="login-password" required placeholder="Masukkan Password" class="w-full pl-10 pr-3 py-3 border border-gray-200 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-gray-50/50">
              </div>
            </div>
            <button type="submit" id="btn-login" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3.5 rounded-2xl font-bold shadow-lg transition text-sm flex items-center justify-center space-x-2">
              <span>Masuk Portal</span>
              <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
          </form>
          <p class="text-[11px] text-center text-gray-400 mt-5 font-medium">© SMP Pakar Kab. Bogor - All Rights Reserved</p>
        </div>
      </section>

      <!-- DASHBOARD -->
      <section id="view-dashboard" class="view-section hidden space-y-5">
        <div class="grid grid-cols-2 gap-3">
          <div class="bg-white p-4 rounded-2xl border border-emerald-100 shadow-sm">
            <span class="text-xs text-gray-500 font-semibold">Hadir Hari Ini</span>
            <p id="stat-hadir" class="text-3xl font-extrabold text-emerald-600 mt-1">0</p>
          </div>
          <div class="bg-white p-4 rounded-2xl border border-emerald-100 shadow-sm">
            <span class="text-xs text-gray-500 font-semibold">Pending Izin</span>
            <p id="stat-pending" class="text-3xl font-extrabold text-amber-600 mt-1">0</p>
          </div>
        </div>

        <div>
          <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-3">Menu Utama Portal</h3>
          <div class="grid grid-cols-4 gap-2 text-center">
            <button onclick="switchView('presensi')" class="bg-white p-3.5 rounded-2xl border border-emerald-100 shadow-sm hover:border-emerald-400 transition">
              <i class="fa-solid fa-clipboard-user text-lg text-emerald-600 block mb-1"></i>
              <span class="block text-[11px] font-bold text-gray-700">Presensi</span>
            </button>
            <button onclick="switchView('izin')" class="bg-white p-3.5 rounded-2xl border border-emerald-100 shadow-sm hover:border-emerald-400 transition">
              <i class="fa-solid fa-envelope-open-text text-lg text-teal-600 block mb-1"></i>
              <span class="block text-[11px] font-bold text-gray-700">Izin/Sakit</span>
            </button>
            <button onclick="switchView('jurnal')" class="bg-white p-3.5 rounded-2xl border border-emerald-100 shadow-sm hover:border-emerald-400 transition">
              <i class="fa-solid fa-book-bookmark text-lg text-sky-600 block mb-1"></i>
              <span class="block text-[11px] font-bold text-gray-700">Jurnal</span>
            </button>
            <button onclick="switchView('nilai')" class="bg-white p-3.5 rounded-2xl border border-emerald-100 shadow-sm hover:border-emerald-400 transition">
              <i class="fa-solid fa-award text-lg text-rose-600 block mb-1"></i>
              <span class="block text-[11px] font-bold text-gray-700">Nilai</span>
            </button>
          </div>
        </div>
      </section>

      <!-- VIEW SECTION LAINNYA -->
      <section id="view-presensi" class="view-section hidden"><p class="text-xs text-gray-500">Menu Presensi Active</p></section>
      <section id="view-izin" class="view-section hidden"><p class="text-xs text-gray-500">Menu Izin Active</p></section>
      <section id="view-jurnal" class="view-section hidden"><p class="text-xs text-gray-500">Menu Jurnal Active</p></section>
      <section id="view-nilai" class="view-section hidden"><p class="text-xs text-gray-500">Menu Nilai Active</p></section>

    </main>

    <!-- NAVIGATION -->
    <nav id="bottom-nav" class="fixed bottom-3 left-1/2 -translate-x-1/2 w-[92%] max-w-md bg-white/95 backdrop-blur-md border border-emerald-100 rounded-2xl shadow-2xl flex justify-around p-1.5 z-50 hidden">
      <button onclick="switchView('dashboard')" class="flex flex-col items-center py-1.5 px-3 text-emerald-800 font-medium">
        <i class="fa-solid fa-house text-base"></i>
        <span class="text-[9px] font-bold mt-0.5">Home</span>
      </button>
      <button onclick="switchView('presensi')" class="flex flex-col items-center py-1.5 px-3 text-gray-400 font-medium">
        <i class="fa-solid fa-clipboard-user text-base"></i>
        <span class="text-[9px] font-bold mt-0.5">Presensi</span>
      </button>
      <button onclick="switchView('izin')" class="flex flex-col items-center py-1.5 px-3 text-gray-400 font-medium">
        <i class="fa-solid fa-envelope-open-text text-base"></i>
        <span class="text-[9px] font-bold mt-0.5">Izin</span>
      </button>
    </nav>

  </div>

  <script>
    let currentUser = null;
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxZnRrchCsoH7rCdnfjvj-TsmGYvEezfuW1tgu3FC3bbwnseAo65arI8unxyEv8cnvHjg/exec";

    function runGoogleScript(functionName, args, onSuccess, onFailure) {
      const fullUrl = `${GAS_URL}?fn=${encodeURIComponent(functionName)}&args=${encodeURIComponent(JSON.stringify(args))}`;
      
      fetch(fullUrl)
        .then(res => res.json())
        .then(data => {
          if (onSuccess) onSuccess(data);
        })
        .catch(err => {
          if (onFailure) onFailure(err);
          else alert("Koneksi Gagal: " + err.message);
        });
    }

    document.addEventListener('DOMContentLoaded', function() {
      const savedUser = localStorage.getItem('currentUser');
      if (savedUser) {
        try {
          currentUser = JSON.parse(savedUser);
          initUserSession();
          loadDashboardData();
        } catch(e) {
          localStorage.removeItem('currentUser');
        }
      }
    });

    function handleLogin(e) {
      e.preventDefault();
      const uID = document.getElementById('login-userid').value;
      const pass = document.getElementById('login-password').value;
      const btn = document.getElementById('btn-login');

      btn.innerText = "Memproses...";
      btn.disabled = true;

      runGoogleScript('authenticateUser', [uID, pass], function(res) {
        btn.innerText = "Masuk Portal";
        btn.disabled = false;

        if (res && res.success) { 
          currentUser = res.user; 
          localStorage.setItem('currentUser', JSON.stringify(currentUser));
          initUserSession(); 
          loadDashboardData();
        } else {
          alert(res ? res.message : "Gagal Login. Periksa kembali UserID & Password Anda.");
        }
      });
    }

    function handleLogout() {
      currentUser = null;
      localStorage.removeItem('currentUser');
      document.getElementById('main-header').classList.add('hidden');
      document.getElementById('bottom-nav').classList.add('hidden');
      document.querySelectorAll('.view-section').forEach(v => v.classList.add('hidden'));
      document.getElementById('view-login').classList.remove('hidden');
    }

    function initUserSession() {
      document.getElementById('view-login').classList.add('hidden');
      document.getElementById('main-header').classList.remove('hidden');
      document.getElementById('bottom-nav').classList.remove('hidden');

      document.getElementById('user-display-name').textContent = currentUser.nama;
      document.getElementById('user-display-role').textContent = currentUser.role + ' (' + currentUser.kelas + ')';

      switchView('dashboard');
    }

    function switchView(viewName) {
      document.querySelectorAll('.view-section').forEach(v => v.classList.add('hidden'));
      const activeView = document.getElementById('view-' + viewName);
      if (activeView) activeView.classList.remove('hidden');
    }

    function loadDashboardData() {
      if (!currentUser) return;
      runGoogleScript('getDashboardSummary', [currentUser], function(res) {
        if (res && res.presensi) {
          document.getElementById('stat-hadir').textContent = res.presensi.Hadir || 0;
          document.getElementById('stat-pending').textContent = res.pendingIzin || 0;
        }
      });
    }
  </script>
</body>
</html>
